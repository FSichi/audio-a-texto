<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Audio a Texto</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <button id="back" class="icon-btn" title="Volver" hidden><i data-icon="back"></i></button>
    <div class="brand">
      <img src="icons/icon32.png" alt="" width="18" height="18">
      <span id="title">Audio a Texto</span>
    </div>
    <div class="bar-actions">
      <button id="open-history" class="icon-btn" title="Historial"><i data-icon="history"></i></button>
      <button id="open-settings" class="icon-btn" title="Ajustes" aria-expanded="false"><i data-icon="sliders"></i></button>
    </div>
  </header>

  <div id="settings" class="sheet" hidden>
    <div class="sheet-row">
      <span class="label">Idioma</span>
      <select id="language">
        <option value="">Detectar automáticamente</option>
        <option value="es" selected>Español</option>
        <option value="en">Inglés</option>
        <option value="pt">Portugués</option>
        <option value="fr">Francés</option>
        <option value="it">Italiano</option>
        <option value="de">Alemán</option>
      </select>
    </div>
    <div class="sheet-row">
      <span class="label">Calidad</span>
      <div class="segmented" id="model" role="radiogroup">
        <label><input type="radio" name="model" value="onnx-community/whisper-tiny"><span>Rápida<small>120 MB</small></span></label>
        <label><input type="radio" name="model" value="onnx-community/whisper-base" checked><span>Equilibrada<small>210 MB</small></span></label>
        <label><input type="radio" name="model" value="onnx-community/whisper-small"><span>Precisa<small>590 MB</small></span></label>
      </div>
      <p class="hint">El modelo se descarga una sola vez y queda guardado en el navegador.</p>
    </div>
  </div>

  <main>
    <section id="view-home" class="view">
      <label class="drop" id="drop">
        <input type="file" id="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.flac,.ogg,.opus,.webm,.mp4" multiple hidden>
        <span class="drop-icon"><i data-icon="upload"></i></span>
        <span class="drop-title">Soltá un audio o <u>elegí archivos</u></span>
        <span class="drop-sub">MP3, WAV, M4A, OGG, FLAC, WEBM o MP4</span>
      </label>
      <button id="summary" class="summary" type="button"></button>

      <div id="job" class="job" hidden>
        <div class="job-head">
          <div class="job-info">
            <strong id="job-title"></strong>
            <span id="job-detail"></span>
          </div>
          <button id="cancel" class="icon-btn sm" title="Cancelar"><i data-icon="x"></i></button>
        </div>
        <div class="progress"><div id="progress-fill"></div></div>
        <p id="job-preview" class="job-preview"></p>
      </div>

      <div id="results" class="stack"></div>
    </section>

    <section id="view-history" class="view" hidden>
      <label class="search">
        <i data-icon="search"></i>
        <input id="history-search" type="search" placeholder="Buscar en transcripciones">
      </label>
      <div id="history-list" class="stack"></div>
      <p id="history-empty" class="empty" hidden>No hay transcripciones guardadas.</p>
    </section>
  </main>

  <footer class="foot">
    <span id="engine-dot" class="dot"></span>
    <span id="engine">Motor sin cargar</span>
    <span class="sep">·</span>
    <i data-icon="lock"></i>
    <span>Todo se procesa en tu equipo</span>
  </footer>

  <div id="toast" class="toast" role="status" hidden></div>

  <template id="result-tpl">
    <article class="result">
      <header class="result-head">
        <div class="result-title">
          <h3 class="name"></h3>
          <span class="meta"></span>
        </div>
        <button class="icon-btn sm remove" title="Quitar"><i data-icon="x"></i></button>
      </header>
      <div class="player" hidden>
        <button class="play" title="Reproducir"><i data-icon="play"></i></button>
        <input class="seek" type="range" min="0" max="1000" value="0" aria-label="Posición">
        <span class="time">00:00</span>
      </div>
      <div class="text"></div>
      <footer class="result-actions">
        <button class="btn primary copy"><i data-icon="copy"></i>Copiar</button>
        <div class="group" role="group" aria-label="Descargar">
          <button class="btn dl" data-format="txt" title="Texto plano">TXT</button>
          <button class="btn dl" data-format="srt" title="Subtítulos">SRT</button>
          <button class="btn dl" data-format="md" title="Markdown">MD</button>
        </div>
        <button class="icon-btn times" title="Mostrar marcas de tiempo" aria-pressed="false"><i data-icon="clock"></i></button>
      </footer>
    </article>
  </template>

  <script type="module" src="sidepanel.js"></script>
</body>
</html>
